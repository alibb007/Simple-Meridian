<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Meridian guided tour</title>
<meta name="description" content="A guided tour of Google Meridian, the open-source marketing mix model, on a made-up company's results. Plays in your browser, nothing to install.">
<!-- Static page: no cookies, no trackers, no third-party requests. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip" href="#app-main">Skip to content</a>
<div class="app" id="app">
  <aside class="app-side" aria-label="Tour chapters">
    <div class="brand">
      <span class="logo"><img src="assets/logo.png" alt="Simple Meridian logo"></span>
      <span class="brandtext"><b>Simple Meridian</b><span>Guided tour</span></span>
      <button class="fold" id="fold" type="button" aria-expanded="true" aria-label="Hide the chapter list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
    </div>
    <nav id="chapters" aria-label="Chapters"></nav>
    <div class="side-foot">
      <a class="btn btn-gold" href="https://github.com/alibb007/Simple-Meridian#quick-start" target="_blank" rel="noopener noreferrer">Run it on your own data</a>
      <a href="https://developers.google.com/meridian" target="_blank" rel="noopener noreferrer">Google Meridian</a>
      <a href="https://developers.google.com/meridian/geox" target="_blank" rel="noopener noreferrer">Meridian GeoX</a>
      <a href="https://github.com/alibb007/Simple-Meridian" target="_blank" rel="noopener noreferrer">Source code</a>
      <p>Made-up data. Runs in your browser, sets no cookies and sends nothing. Not affiliated with Google; Meridian is a trademark of Google LLC.</p>
    </div>
  </aside>

  <main class="app-main" id="app-main"></main>
  <div class="spot" id="spot" aria-hidden="true"></div>

  <div class="caption floating" id="t-caption" role="region" aria-label="Tour caption" aria-live="polite" tabindex="-1">
    <div class="top"><span id="t-chapter"></span><span class="sep" aria-hidden="true">·</span><span id="t-count"></span></div>
    <div class="progress" aria-hidden="true"><span id="t-progress"></span></div>
    <h3 id="t-title"></h3>
    <p id="t-body"></p>
    <div class="ctrl">
      <button class="btn btn-light" id="t-back" type="button">Back</button>
      <button class="btn btn-primary" id="t-next" type="button">Next</button>
      <button class="btn btn-link" id="t-skip" type="button">Skip this part</button>
      <button class="btn btn-light" id="t-again" type="button" hidden>Back to the start</button>
    </div>
    <div class="keys" aria-hidden="true">Arrow keys work too</div>
  </div>
</div>
<script src="assets/demo.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
