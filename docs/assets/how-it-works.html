<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Meridian works</title>
<style>
  :root {
    --navy: #0B1B3F; --ink: #101828; --muted: #5B6475; --border: #E2E7F0; --surface: #FFFFFF;
    --primary: #2459E8; --bg: #F4F6FB;
    --tv: #2A78D6; --radio: #EB6834; --display: #1BAF7A; --search: #EDA100; --social: #E87BA4; --email: #008300;
    --baseline: #B8C2D6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Red Hat Text", "Red Hat Display", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .mg { width: 100%; max-width: 1100px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border);
        border-radius: 18px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 12px 18px 6px; min-height: 56px; }
  .dots { display: flex; gap: 6px; flex: none; }
  .dots button { width: 26px; height: 8px; border-radius: 99px; border: 0; padding: 0; background: #E4E7EC; cursor: pointer; }
  .dots button.on { background: var(--primary); }
  .dots button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .cap { font-family: "Red Hat Display", "Red Hat Text", system-ui, sans-serif; font-weight: 700; font-size: 17px;
         line-height: 1.3; transition: opacity .35s; }
  .cap small { display: block; font-family: "Red Hat Text", system-ui, sans-serif; font-weight: 500; font-size: 13.5px;
               color: var(--muted); margin-top: 2px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: "Red Hat Text", system-ui, sans-serif; }
  .lbl { font-size: 14px; fill: var(--ink); font-weight: 600; }
  .sub { font-size: 12px; fill: var(--muted); }
  .big { font-family: "Red Hat Display", system-ui, sans-serif; font-weight: 800; font-size: 44px; fill: #067647; }
  @media (max-width: 560px) { .cap { font-size: 15px; } .cap small { font-size: 12.5px; } }
</style>
</head>
<body>
<div class="mg" role="img" aria-label="Animation: weekly ad spend flows into sales; Meridian splits sales into baseline and each channel; response curves show where extra spend stops helping; budget moves to better channels for 5.2% more revenue.">
  <div class="bar">
    <div class="dots" id="dots" aria-label="Scenes"></div>
    <div class="cap" id="cap" aria-live="polite"></div>
  </div>
  <svg viewBox="0 0 1100 300" aria-hidden="true">
    <defs>
      <linearGradient id="salesg" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#2459E8"/><stop offset="1" stop-color="#6D4AE8"/>
      </linearGradient>
    </defs>
    <!-- Scene 1: spend flows into sales -->
    <g id="s1" class="scene">
      <g id="s1rows"></g>
      <g id="s1dots"></g>
      <rect x="880" y="40" width="120" height="240" rx="14" fill="#EEF3FF"/>
      <rect id="s1sales" x="880" y="280" width="120" height="0" rx="14" fill="url(#salesg)"/>
      <text x="940" y="30" text-anchor="middle" class="lbl">Weekly sales</text>
    </g>
    <!-- Scene 2: sales split into baseline + channels -->
    <g id="s2" class="scene" opacity="0">
      <g id="s2stack"></g>
      <g id="s2labels"></g>
      <text x="420" y="24" text-anchor="middle" class="lbl">All sales over 3 years</text>
    </g>
    <!-- Scene 3: response curves -->
    <g id="s3" class="scene" opacity="0"><g id="s3panels"></g></g>
    <!-- Scene 4: budget rebalances -->
    <g id="s4" class="scene" opacity="0">
      <g id="s4bars"></g>
      <text x="40" y="24" class="lbl">Same total budget: $116.1M</text>
      <text x="40" y="44" class="sub">light = last year's split · solid = Meridian's plan</text>
      <text id="s4num" x="1060" y="150" text-anchor="end" class="big">+0.0%</text>
      <text x="1060" y="180" text-anchor="end" class="lbl">more revenue</text>
      <text id="s4abs" x="1060" y="202" text-anchor="end" class="sub">+$0.0M over the last year</text>
    </g>
  </svg>
</div>
<script>
(function () {
  // Numbers from the demo model (data/demo/), so the animation matches the app.
  var C = { TV: "#2A78D6", Radio: "#EB6834", Display: "#1BAF7A", Search: "#EDA100", Social: "#E87BA4", Email: "#008300" };
  var FOUR = [["TV", 46.5], ["Radio", 12.2], ["Search", 17.8], ["Email", 5.9]];
  var SHARES = [["Baseline", 22.1, "#B8C2D6"], ["TV", 25.7, C.TV], ["Radio", 16.5, C.Radio], ["Email", 12.8, C.Email],
                ["Search", 8.5, C.Search], ["Display + Social", 14.4, "#A5B4FC"]];
  var PLAN = [["TV", 46.5, 52.0], ["Radio", 12.2, 15.9], ["Display", 24.9, 17.4], ["Search", 17.8, 12.9],
              ["Social", 8.8, 10.2], ["Email", 5.9, 7.7]];
  var GAIN_PCT = 5.2, GAIN_ABS = 18.7;
  var SCENES = [
    ["Each week you spend on ads, and sales come in.", "Sales also move with season and price, so the link is not obvious."],
    ["Meridian splits sales into a baseline and what each channel added.", "Baseline is what you'd sell with no ads at all."],
    ["It learns where more money stops paying back.", "Steep: extra budget still works. Flat: the channel is full."],
    ["Then it moves budget to where the next dollar earns most.", "Same total budget, more revenue."]
  ];
  var DUR = 4000, N = SCENES.length;
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function ease(t) { t = Math.max(0, Math.min(1, t)); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function clamp(t) { return Math.max(0, Math.min(1, t)); }

  // ---- Scene 1 setup
  var rows = document.getElementById("s1rows"), dotsG = document.getElementById("s1dots");
  var rowY = [70, 130, 190, 250], s1bars = [], flows = [];
  FOUR.forEach(function (c, i) {
    el("text", { x: 40, y: rowY[i] + 5, "class": "lbl" }, rows).textContent = c[0];
    el("rect", { x: 110, y: rowY[i] - 12, width: 220, height: 24, rx: 7, fill: "#F2F4F7" }, rows);
    s1bars.push(el("rect", { x: 110, y: rowY[i] - 12, width: 0, height: 24, rx: 7, fill: C[c[0]] }, rows));
    el("text", { x: 340, y: rowY[i] + 5, "class": "sub" }, rows).textContent = "$" + c[1] + "M / yr";
    for (var k = 0; k < 6; k++) flows.push({ ch: i, phase: k / 6, dot: el("circle", { r: 6, fill: C[c[0]], opacity: 0 }, dotsG) });
  });
  var sales = document.getElementById("s1sales");
  el("text", { x: 110, y: 40, "class": "sub" }, rows).textContent = "Ad spend per channel";

  // ---- Scene 2 setup
  var stack = document.getElementById("s2stack"), labs = document.getElementById("s2labels");
  var segs = [], total = SHARES.reduce(function (a, s) { return a + s[1]; }, 0), H = 240, y0 = 280, acc = 0;
  SHARES.forEach(function (s, i) {
    var h = s[1] / total * H, y = y0 - acc - h; acc += h;
    var r = el("rect", { x: 360, y: y, width: 120, height: h - 2, rx: 6, fill: s[2], opacity: 0 }, stack);
    var g = el("g", { opacity: 0 }, labs);
    el("line", { x1: 486, x2: 540, y1: y + h / 2, y2: y + h / 2, stroke: "#D0D5DD" }, g);
    el("text", { x: 548, y: y + h / 2 + 5, "class": "lbl" }, g).textContent = s[0] + "  " + Math.round(s[1]) + "%";
    segs.push({ r: r, g: g, y: y, h: h });
  });

  // ---- Scene 3 setup
  var panels = document.getElementById("s3panels"), curves = [];
  var CUR = [["TV", .45, null], ["Radio", .22, "still steep"], ["Search", .78, "full"], ["Email", .18, "still steep"]];
  CUR.forEach(function (c, i) {
    var ox = 40 + i * 265, oy = 50, w = 220, h = 190, k = 4.2;
    el("rect", { x: ox - 8, y: oy - 34, width: w + 16, height: h + 60, rx: 14, fill: "#F8FAFC", stroke: "#E2E7F0" }, panels);
    el("text", { x: ox, y: oy - 12, "class": "lbl" }, panels).textContent = c[0];
    el("line", { x1: ox, x2: ox + w, y1: oy + h, y2: oy + h, stroke: "#D0D5DD" }, panels);
    var d = "", pts = [];
    for (var j = 0; j <= 40; j++) {
      var t = j / 40, yv = (1 - Math.exp(-k * t)) / (1 - Math.exp(-k));
      pts.push([ox + t * w, oy + h - yv * (h - 20)]);
    }
    pts.forEach(function (p, j) { d += (j ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); });
    var path = el("path", { d: d, fill: "none", stroke: C[c[0]], "stroke-width": 3.5, "stroke-linecap": "round" }, panels);
    var len = path.getTotalLength ? path.getTotalLength() : 400;
    path.setAttribute("stroke-dasharray", len); path.setAttribute("stroke-dashoffset", len);
    var p = pts[Math.round(c[1] * 40)];
    var dot = el("circle", { cx: p[0], cy: p[1], r: 8, fill: "#fff", stroke: C[c[0]], "stroke-width": 3.5, opacity: 0 }, panels);
    var tag = null;
    if (c[2]) {
      tag = el("text", { x: c[2] === "saturated" ? ox + w : p[0] + 14, y: c[2] === "saturated" ? pts[40][1] - 14 : p[1] + 22,
                         "text-anchor": c[2] === "saturated" ? "end" : "start", "class": "sub", opacity: 0,
                         fill: c[2] === "saturated" ? "#B42318" : "#067647" }, panels);
      tag.textContent = c[2];
      tag.style.fill = c[2] === "saturated" ? "#B42318" : "#067647";
      tag.style.fontWeight = "700";
    }
    el("text", { x: ox, y: oy + h + 18, "class": "sub" }, panels).textContent = "spend →";
    curves.push({ path: path, len: len, dot: dot, tag: tag });
  });

  // ---- Scene 4 setup
  var barsG = document.getElementById("s4bars"), pbars = [], maxV = 55, bw = 46;
  PLAN.forEach(function (c, i) {
    var x = 60 + i * 140, base = 270;
    var ghost = el("rect", { x: x, y: base - c[1] / maxV * 190, width: bw, height: c[1] / maxV * 190, rx: 8, fill: C[c[0]], opacity: .25 }, barsG);
    var bar = el("rect", { x: x + bw + 6, y: base - c[1] / maxV * 190, width: bw, height: c[1] / maxV * 190, rx: 8, fill: C[c[0]] }, barsG);
    el("text", { x: x + bw + 3, y: 292, "text-anchor": "middle", "class": "lbl" }, barsG).textContent = c[0];
    var pct = Math.round((c[2] - c[1]) / c[1] * 100);
    var lab = el("text", { x: x + bw + 6 + bw / 2, y: 0, "text-anchor": "middle", "class": "sub", opacity: 0 }, barsG);
    lab.textContent = (pct > 0 ? "+" : "") + pct + "%";
    lab.style.fill = pct > 0 ? "#067647" : "#B42318"; lab.style.fontWeight = "700";
    pbars.push({ bar: bar, lab: lab, from: c[1], to: c[2], base: base });
  });
  var num = document.getElementById("s4num"), abs = document.getElementById("s4abs");

  // ---- Render one frame: scene index s, progress p in [0, 1]
  function render(s, p) {
    for (var i = 0; i < N; i++) {
      document.getElementById("s" + (i + 1)).setAttribute("opacity", i === s ? Math.min(1, Math.min(p, 1 - p) * 10 + (reduce ? 1 : 0)) : 0);
    }
    if (s === 0) {
      FOUR.forEach(function (c, i) { s1bars[i].setAttribute("width", ease(p * 3) * c[1] / 46.5 * 220); });
      flows.forEach(function (f) {
        var t = (p * 2.2 + f.phase) % 1, sx = 430, sy = rowY[f.ch], ex = 880, ey = 160, cx = 680, cy = rowY[f.ch];
        var x = (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * cx + t * t * ex;
        var y = (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * cy + t * t * ey;
        f.dot.setAttribute("cx", x); f.dot.setAttribute("cy", y);
        f.dot.setAttribute("opacity", reduce ? 0 : (p > .15 && p < .92 ? Math.sin(t * Math.PI) : 0));
      });
      var sh = ease((p - .1) / .8) * 220;
      sales.setAttribute("y", 280 - sh); sales.setAttribute("height", sh);
    } else if (s === 1) {
      segs.forEach(function (g, i) {
        var t = ease((p - .08 - i * .1) / .18);
        g.r.setAttribute("opacity", t); g.r.setAttribute("y", g.y + (1 - t) * 20);
        g.g.setAttribute("opacity", t);
      });
    } else if (s === 2) {
      curves.forEach(function (c, i) {
        var t = ease((p - .05 - i * .08) / .45);
        c.path.setAttribute("stroke-dashoffset", c.len * (1 - t));
        c.dot.setAttribute("opacity", ease((p - .55 - i * .04) / .1));
        if (c.tag) c.tag.setAttribute("opacity", ease((p - .65) / .1));
      });
    } else if (s === 3) {
      var t = ease((p - .1) / .5);
      pbars.forEach(function (b) {
        var v = b.from + (b.to - b.from) * t, h = v / maxV * 190;
        b.bar.setAttribute("y", b.base - h); b.bar.setAttribute("height", h);
        b.lab.setAttribute("y", b.base - h - 8); b.lab.setAttribute("opacity", ease((p - .55) / .1));
      });
      var n = ease((p - .45) / .35);
      num.textContent = "+" + (GAIN_PCT * n).toFixed(1) + "%";
      abs.textContent = "+$" + (GAIN_ABS * n).toFixed(1) + "M over the last year";
    }
  }

  // ---- Captions and scene dots
  var cap = document.getElementById("cap"), dots = document.getElementById("dots"), current = -1;
  SCENES.forEach(function (s, i) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", "Scene " + (i + 1) + ": " + s[0]);
    b.addEventListener("click", function () { jump(i); });
    dots.appendChild(b);
  });
  function setCaption(s) {
    if (s === current) return;
    current = s;
    cap.innerHTML = (s + 1) + ". " + SCENES[s][0] + "<small>" + SCENES[s][1] + "</small>";
    [].forEach.call(dots.children, function (d, i) { d.className = i === s ? "on" : ""; });
  }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var start = performance.now(), offset = 0;
  function jump(i) {
    offset = i * DUR; start = performance.now();
    if (reduce) { setCaption(i); render(i, 1); }
  }
  if (reduce) {
    // No motion: show the final frame of the last scene; the dots switch scenes.
    setCaption(N - 1); render(N - 1, 1);
    return;
  }
  function tick(now) {
    var L = DUR * N, t = (((now - start + offset) % L) + L) % L, s = Math.floor(t / DUR), p = (t % DUR) / DUR;  // rAF time can precede start
    setCaption(s); render(s, p);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
