<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A shop with an ad budget problem</title>
<style>
  @font-face { font-family: "Red Hat Display"; font-weight: 700; font-display: swap; src: url("fonts/red-hat-display-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Red Hat Display"; font-weight: 800; font-display: swap; src: url("fonts/red-hat-display-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Red Hat Text"; font-weight: 500; font-display: swap; src: url("fonts/red-hat-text-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Red Hat Text"; font-weight: 600; font-display: swap; src: url("fonts/red-hat-text-latin-600-normal.woff2") format("woff2"); }
  :root { --ink: #0B1B3F; --muted: #5B6475; --cream: #FFF8EC; --gold: #FFD166; --primary: #2459E8; --violet: #6D4AE8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Red Hat Text", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .mg { width: 100%; max-width: 1180px; margin: 0 auto; background: var(--cream); border: 3px solid var(--ink); border-radius: 22px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 14px 18px 2px; min-height: 68px; }
  .pp { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  .pp svg { width: 14px; height: 14px; }
  .dots { display: flex; gap: 6px; flex: none; }
  .dots button { width: 26px; height: 9px; border-radius: 99px; border: 2px solid var(--ink); padding: 0; background: #fff; cursor: pointer; overflow: hidden; position: relative; }
  .dots button i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); }
  .dots button.done { background: var(--gold); }
  .dots button:focus-visible, .pp:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .cap { font-family: "Red Hat Display", system-ui, sans-serif; font-weight: 800; font-size: 19px; line-height: 1.25; }
  .cap .act { display: block; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #B54708; margin-bottom: 2px; }
  .cap small { display: block; font-family: "Red Hat Text", system-ui, sans-serif; font-weight: 500; font-size: 14px; color: #475467; margin-top: 3px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: "Red Hat Text", system-ui, sans-serif; }
  .lbl { font-size: 15px; fill: var(--ink); font-weight: 600; }
  .sub { font-size: 13px; fill: #475467; font-weight: 500; }
  .big { font-family: "Red Hat Display", system-ui, sans-serif; font-weight: 800; }
  @media (max-width: 600px) { .bar { flex-wrap: wrap; } .cap { flex-basis: 100%; font-size: 15px; } .cap small { font-size: 12.5px; } }
</style>
</head>
<body>
<div class="mg" id="mg" role="img" aria-label="Story in six scenes: a shop spends on six ad channels, cannot tell which ones work, has to plan next year's budget, stops guessing and asks Google Meridian, sees the return on each channel, and moves money to the channels that still pay back.">
  <div class="bar">
    <button class="pp" id="pp" type="button" aria-label="Pause the story"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="ppicon" fill="currentColor" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <div class="dots" id="dots" aria-label="Scenes"></div>
    <div class="cap" id="cap" aria-live="polite"></div>
  </div>
  <svg id="stage" viewBox="0 0 1100 330" aria-hidden="true"></svg>
</div>
<script>
(function () {
  "use strict";
  // Numbers come from the demo model (the page that embeds this), with the same values as a fallback.
  var D = null;
  try { D = window.parent && window.parent.SM_DEMO; } catch (e) {}
  var PLAN = D ? D.plan : [
    { channel: "TV", current_spend: 46.5e6, optimized_spend: 52.0e6 }, { channel: "Radio", current_spend: 12.2e6, optimized_spend: 15.9e6 },
    { channel: "Display", current_spend: 24.9e6, optimized_spend: 17.4e6 }, { channel: "Search", current_spend: 17.8e6, optimized_spend: 12.9e6 },
    { channel: "Social", current_spend: 8.8e6, optimized_spend: 10.2e6 }, { channel: "Email", current_spend: 5.9e6, optimized_spend: 7.7e6 }];
  var ROI = D ? D.summary.filter(function (r) { return !r.is_total; }).map(function (r) { return { c: r.channel, v: r.roi }; })
              : [{ c: "Email", v: 10.62 }, { c: "Radio", v: 6.81 }, { c: "Social", v: 3.36 }, { c: "TV", v: 2.60 }, { c: "Search", v: 2.29 }, { c: "Display", v: 1.61 }];
  var T = D ? D.plan_totals : { budget_before: 116.1e6, outcome_before: 359.6e6, outcome_after: 378.3e6 };
  var WEEKS = D ? D.fit.map(function (r) { return r.actual; }) : null;
  var COLOR = { TV: "#2A78D6", Radio: "#EB6834", Display: "#1BAF7A", Search: "#EDA100", Social: "#E87BA4", Email: "#008300" };
  ROI.sort(function (a, b) { return b.v - a.v; });
  var M = function (x) { return "$" + (x / 1e6).toFixed(1) + "M"; };
  var BUDGET = M(T.budget_before), GAIN = T.outcome_after - T.outcome_before, PCT = GAIN / T.outcome_before * 100;
  var best = ROI[0], worst = ROI[ROI.length - 1];
  var INK = "#0B1B3F";

  // Pixar story spine: once upon a time, every day, until one day, because of that (twice), until finally.
  var SCENES = [
    ["Once upon a time", "Meet a made-up online shop with a big ad habit.", "Last year it spent " + BUDGET + " on ads across six channels. Every channel had a fan."],
    ["Every week", "Sales went up and down, and every team took the credit.", "Ads, discounts and the season all push sales, so nobody could say which channel earned what."],
    ["Until one day", "The boss asked the question nobody wanted.", "Next year's budget is the same " + BUDGET + ". Where should it go?"],
    ["Because of that", "They stopped guessing and asked Google Meridian.", "Another year on gut feel means another " + BUDGET + " spent blind. Meridian turns 156 weeks of numbers into answers."],
    ["Because of that", "The answers were a little embarrassing.", best.c + ", the smallest budget, returned $" + best.v.toFixed(2) + " for every $1. " + worst.c + " returned $" + worst.v.toFixed(2) + "."],
    ["Until finally", "They moved the money and kept the budget.", "Same " + BUDGET + ", " + M(GAIN) + " more sales from ads in a year (+" + PCT.toFixed(1) + "%). Everyone took the credit again."]
  ];
  var N = SCENES.length, DUR = 14000;  // each scene holds 14 s

  var NS = "http://www.w3.org/2000/svg", stage = document.getElementById("stage");
  function el(name, attrs, parent, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    (parent || stage).appendChild(e);
    return e;
  }
  var ink = function (a) { a.stroke = INK; a["stroke-width"] = a["stroke-width"] || 3.5; a["stroke-linejoin"] = "round"; return a; };
  var ease = function (t) { t = Math.max(0, Math.min(1, t)); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
  // A speech bubble: rounded box with a tail, dark ink, light text.
  function bubble(parent, x, y, w, h, tailX, tailY, lines, accent, light, size) {
    var g = el("g", { opacity: 0 }, parent), fill = light ? "#fff" : INK, fs = size || 22;
    var bx = Math.max(x + 34, Math.min(tailX - 12, x + w - 64));  // tail base sits on the flat bottom edge
    el("path", ink({ d: "M" + bx + " " + (y + h - 6) + " L" + tailX + " " + tailY + " L" + (bx + 30) + " " + (y + h - 6) + " Z", fill: fill }), g);
    el("rect", ink({ x: x, y: y, width: w, height: h, rx: 18, fill: fill }), g);
    el("rect", { x: bx + 3, y: y + h - 8, width: 24, height: 10, fill: fill }, g);  // hides the seam where the tail joins
    lines.forEach(function (ln, i) {
      el("text", { x: x + 20, y: y + 16 + fs + i * (fs + 8), class: "big", "font-size": fs, fill: light ? INK : (i === lines.length - 1 && accent ? "#FFD166" : "#fff") }, g, ln);
    });
    return { g: g, cx: tailX, cy: tailY };
  }
  // Small line icons for each channel, drawn in white; each has one quiet loop of motion.
  function icon(parent, ch, x, y) {
    var g = el("g", { transform: "translate(" + x + " " + y + ")", fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent), m = {};
    if (ch === "TV") {
      el("rect", { x: 2, y: 4, width: 40, height: 28, rx: 5 }, g); el("path", { d: "M14 40h16M22 32v8" }, g);
      m.part = el("path", { d: "M18 12 l10 6 l-10 6 Z", fill: "#fff" }, g); m.kind = "blink";
    } else if (ch === "Radio") {
      el("rect", { x: 2, y: 16, width: 34, height: 24, rx: 5 }, g); el("circle", { cx: 13, cy: 28, r: 5 }, g); el("path", { d: "M24 24h8M24 32h8M8 16 L30 4" }, g);
      m.part = el("path", { d: "M38 6 q6 6 0 12 M43 2 q10 10 0 20" }, g); m.kind = "blink";
    } else if (ch === "Display") {
      el("rect", { x: 2, y: 6, width: 40, height: 30, rx: 4 }, g);
      m.part = el("rect", { x: 7, y: 12, width: 14, height: 18, rx: 2, fill: "#fff" }, g); m.kind = "slide";
    } else if (ch === "Search") {
      m.part = el("g", {}, g); el("circle", { cx: 18, cy: 18, r: 12 }, m.part); el("path", { d: "M27 27 L40 40" }, m.part); m.kind = "orbit";
    } else if (ch === "Social") {
      m.part = el("path", { d: "M22 38 C 6 28, 2 18, 8 10 C 13 4, 20 6, 22 12 C 24 6, 31 4, 36 10 C 42 18, 38 28, 22 38 Z", fill: "#fff" }, g); m.kind = "beat";
    } else {
      m.part = el("g", {}, g); el("rect", { x: 2, y: 8, width: 40, height: 28, rx: 4 }, m.part); el("path", { d: "M2 10 L22 24 L42 10" }, m.part); m.kind = "bob";
    }
    return m;
  }
  function animateIcon(m, ms) {
    var w = ms / 1000;
    if (m.kind === "blink") m.part.setAttribute("opacity", (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(w * 3))).toFixed(2));
    else if (m.kind === "slide") m.part.setAttribute("x", (7 + 16 * (0.5 + 0.5 * Math.sin(w * 1.6))).toFixed(1));
    else if (m.kind === "orbit") m.part.setAttribute("transform", "translate(" + (2 * Math.cos(w * 2)).toFixed(1) + " " + (2 * Math.sin(w * 2)).toFixed(1) + ")");
    else if (m.kind === "beat") { var k = 1 + 0.08 * Math.max(0, Math.sin(w * 4)); m.part.setAttribute("transform", "translate(22 22) scale(" + k.toFixed(3) + ") translate(-22 -22)"); }
    else m.part.setAttribute("transform", "translate(0 " + (-2.5 * (0.5 + 0.5 * Math.sin(w * 2.2))).toFixed(1) + ")");
  }
  function shop(parent, x, y, s) {
    var g = el("g", { transform: "translate(" + x + " " + y + ") scale(" + s + ")" }, parent);
    el("rect", ink({ x: 10, y: 70, width: 180, height: 140, rx: 12, fill: "#fff" }), g);
    el("path", ink({ d: "M0 70 L30 20 H170 L200 70 Z", fill: "#2459E8" }), g);
    el("path", ink({ d: "M0 70 q17 22 33 0 q17 22 33 0 q17 22 33 0 q17 22 34 0 q17 22 33 0 q17 22 34 0", fill: "#FFD166" }), g);
    el("rect", ink({ x: 78, y: 136, width: 46, height: 74, rx: 6, fill: "#EEF3FF" }), g);
    el("rect", ink({ x: 26, y: 104, width: 38, height: 30, rx: 5, fill: "#EEF3FF" }), g);
    el("rect", ink({ x: 138, y: 104, width: 38, height: 30, rx: 5, fill: "#EEF3FF" }), g);
    return g;
  }
  var G = [];
  for (var s = 0; s < N; s++) G.push(el("g", { opacity: 0 }));

  // ---- Scene 1: the shop and its six ad signs
  var g1 = G[0];
  shop(g1, 60, 80, 1.1);
  var b1 = bubble(g1, 40, 8, 330, 56, 150, 92, ["We spent " + BUDGET + " on ads."], false);
  var signs = PLAN.slice().sort(function (a, b) { return b.current_spend - a.current_spend; }).map(function (r, i) {
    var col = i % 3, row = Math.floor(i / 3), x = 430 + col * 220, y = 40 + row * 140;
    var g = el("g", { opacity: 0 }, g1);
    el("line", ink({ x1: x + 100, y1: y - 10, x2: x + 100, y2: y + 6 }), g);
    el("rect", ink({ x: x, y: y + 6, width: 200, height: 104, rx: 16, fill: COLOR[r.channel] }), g);
    el("text", { x: x + 18, y: y + 46, class: "big", "font-size": 24, fill: "#fff" }, g, r.channel);
    el("text", { x: x + 18, y: y + 84, class: "big", "font-size": 30, fill: "#fff" }, g, M(r.current_spend));
    return { g: g, cx: x + 100, cy: y + 58, ic: icon(g, r.channel, x + 142, y + 30) };
  });

  // ---- Scene 2: weekly sales nobody can explain
  var g2 = G[1];
  el("rect", ink({ x: 40, y: 20, width: 1020, height: 290, rx: 20, fill: "#fff" }), g2);
  var pts = WEEKS ? WEEKS.slice(-104) : Array.apply(null, Array(104)).map(function (_, k) { return 6 + 2.4 * Math.sin(k / 8) + Math.sin(k * 1.7); });
  var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
  var X = function (k) { return 80 + k / (pts.length - 1) * 940; }, Y = function (v) { return 280 - (v - lo) / (hi - lo) * 170; };
  el("text", { x: 70, y: 56, class: "lbl" }, g2, "Weekly sales, last two years");
  var path = el("path", { d: pts.map(function (v, k) { return (k ? "L" : "M") + X(k).toFixed(1) + " " + Y(v).toFixed(1); }).join(""),
                          fill: "none", stroke: "#2459E8", "stroke-width": 4, "stroke-linejoin": "round", "stroke-linecap": "round" }, g2);
  var plen = 0; try { plen = path.getTotalLength(); } catch (e) { plen = 3000; }
  path.setAttribute("stroke-dasharray", plen);
  var peaks = [];
  for (var k = 6; k < pts.length - 6; k++) if (pts[k] === Math.max.apply(null, pts.slice(k - 6, k + 7)) && peaks.length < 6) peaks.push(k);
  var qs = peaks.map(function (k, i) {
    var g = el("g", { opacity: 0 }, g2), cx = X(k), cy = Y(pts[k]) - 34;
    el("circle", ink({ cx: cx, cy: cy, r: 19, fill: "#FFD166" }), g);
    el("text", { x: cx, y: cy + 8, "text-anchor": "middle", class: "big", "font-size": 22, fill: INK }, g, "?");
    return { g: g, cx: cx, cy: cy, at: k / pts.length };
  });

  // ---- Scene 3: the boss's question
  var g3 = G[2], boss = el("g", {}, g3);
  el("circle", ink({ cx: 130, cy: 196, r: 34, fill: "#FFE2C2" }), boss);
  el("path", ink({ d: "M70 320 q0 -78 60 -78 q60 0 60 78 Z", fill: "#2459E8" }), boss);
  el("path", ink({ d: "M118 246 l12 34 l12 -34", fill: "#FFD166" }), boss);
  var b3 = bubble(g3, 210, 34, 380, 96, 214, 186, ["Next year: " + BUDGET + ".", "Where should it go?"], true);
  var slots = PLAN.map(function (r, i) {
    var x = 620 + i * 76, g = el("g", { opacity: 0 }, g3);
    el("rect", ink({ x: x, y: 110, width: 62, height: 150, rx: 12, fill: "#fff", "stroke-dasharray": "8 6" }), g);
    el("text", { x: x + 31, y: 196, "text-anchor": "middle", class: "big", "font-size": 32, fill: COLOR[r.channel] }, g, "?");
    el("text", { x: x + 31, y: 288, "text-anchor": "middle", class: "lbl", "font-size": 13 }, g, r.channel);
    return { g: g, cx: x + 31, cy: 185 };
  });
  var guesses = [["TV, obviously.", 588, 14, 142], ["Search, surely.", 742, 14, 148], ["More of everything?", 902, 14, 186]].map(function (q, i) {
    return bubble(g3, q[1], q[2], q[3], 50, q[1] + 56, q[2] + 76, [q[0]], false, true, 15);
  });

  // ---- Scene 4: guessing on the left, what Meridian tells you on the right
  var g4 = G[3];
  var guess = el("g", { opacity: 0 }, g4);
  el("rect", ink({ x: 40, y: 30, width: 330, height: 270, rx: 22, fill: "#fff" }), guess);
  el("text", { x: 64, y: 70, class: "big", "font-size": 22, fill: INK }, guess, "Keep guessing");
  [54, 38, 22].forEach(function (r, i) { el("circle", ink({ cx: 205, cy: 175, r: r, fill: ["#FDECEC", "#fff", "#F04438"][i] }), guess); });
  var darts = [[110, 120], [300, 230], [260, 96], [128, 258]].map(function (p) {
    var d = el("g", { opacity: 0 }, guess);
    el("line", ink({ x1: p[0], y1: p[1], x2: p[0] + 22, y2: p[1] - 22 }), d);
    el("circle", { cx: p[0], cy: p[1], r: 4, fill: INK }, d);
    return d;
  });
  el("text", { x: 64, y: 282, class: "sub", "font-size": 14 }, guess, "Another " + BUDGET + " spent on gut feel");
  var versus = el("g", { opacity: 0 }, g4);
  el("path", ink({ d: "M392 165 h44 m-12 -12 l12 12 l-12 12", fill: "none", "stroke-width": 4, "stroke-linecap": "round" }), versus);
  var box = el("g", { opacity: 0 }, g4);
  el("rect", ink({ x: 460, y: 75, width: 180, height: 180, rx: 28, fill: "#fff" }), box);
  var mark = el("g", { transform: "translate(470 85) scale(0.31)" }, box);
  var mkLines = [["315", "170", "268", "330", "#AECBFA", 58], ["166", "168", "262", "334", "#4285F4", 96], ["328", "168", "424", "334", "#1967D2", 96]].map(function (l) {
    return el("line", { x1: l[0], y1: l[1], x2: l[2], y2: l[3], stroke: l[4], "stroke-width": l[5], "stroke-linecap": "round", "stroke-dasharray": 200, "stroke-dashoffset": 200 }, mark);
  });
  var mkDot = el("circle", { cx: 87, cy: 331, r: 54, fill: "#174EA6", opacity: 0 }, mark);
  el("text", { x: 550, y: 282, "text-anchor": "middle", class: "lbl" }, box, "156 weeks of numbers in");
  var answers = ["What each $1 brought back", "Where extra money is wasted", "A better split of the same budget", "Proof from a real lift test"].map(function (t, i) {
    var g = el("g", { opacity: 0 }, g4), y = 52 + i * 62;
    el("rect", ink({ x: 680, y: y, width: 380, height: 48, rx: 14, fill: ["#EEF3FF", "#FFF4E5", "#ECFDF3", "#F4F0FF"][i] }), g);
    el("circle", ink({ cx: 706, cy: y + 24, r: 11, fill: "#067647" }), g);
    el("path", { d: "M700 " + (y + 24) + " l4 5 l8 -9", fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    el("text", { x: 728, y: y + 30, class: "lbl", "font-size": 16 }, g, t);
    return g;
  });

  // ---- Scene 5: return per $1, by channel
  var g5 = G[4], maxRoi = ROI[0].v, base5 = 270, colW = 120;
  el("line", ink({ x1: 90, x2: 1040, y1: base5, y2: base5 }), g5);
  var yOf = function (v) { return base5 - v / maxRoi * 200; };
  el("line", { x1: 90, x2: 1040, y1: yOf(1), y2: yOf(1), stroke: "#B42318", "stroke-width": 2.5, "stroke-dasharray": "7 6" }, g5);
  el("text", { x: 1040, y: yOf(1) - 8, "text-anchor": "end", class: "sub", fill: "#B42318" }, g5, "$1 back: break-even");
  var rbars = ROI.map(function (r, i) {
    var x = 140 + i * (colW + 34);
    var b = el("rect", ink({ x: x, y: base5, width: colW, height: 0, rx: 12, fill: COLOR[r.c] }), g5);
    var t = el("text", { x: x + colW / 2, y: base5 - 10, "text-anchor": "middle", class: "big", "font-size": 22, fill: INK, opacity: 0 }, g5, "$" + r.v.toFixed(2));
    el("text", { x: x + colW / 2, y: base5 + 26, "text-anchor": "middle", class: "lbl" }, g5, r.c);
    return { b: b, t: t, h: base5 - yOf(r.v) };
  });

  // ---- Scene 6: same budget, better split
  var g6 = G[5], maxB = Math.max.apply(null, PLAN.map(function (r) { return Math.max(r.current_spend, r.optimized_spend); }));
  var pb = PLAN.map(function (r, i) {
    var x = 70 + i * 104, base = 262;
    el("text", { x: x + 36, y: 290, "text-anchor": "middle", class: "lbl", "font-size": 14 }, g6, r.channel);
    el("rect", { x: x, y: base - r.current_spend / maxB * 210, width: 32, height: r.current_spend / maxB * 210, rx: 8, fill: COLOR[r.channel], opacity: .3 }, g6);
    var b = el("rect", ink({ x: x + 38, y: base, width: 32, height: 0, rx: 8, fill: COLOR[r.channel], "stroke-width": 3 }), g6);
    return { b: b, from: r.current_spend / maxB * 210, to: r.optimized_spend / maxB * 210, base: base };
  });
  el("line", ink({ x1: 60, x2: 690, y1: 262, y2: 262 }), g6);
  el("text", { x: 70, y: 34, class: "sub" }, g6, "Faded: today · solid: with the plan");
  var badge = el("g", { opacity: 0 }, g6), starPts = [];
  for (var q = 0; q < 24; q++) { var ang = q / 24 * Math.PI * 2, rr = q % 2 ? 108 : 124; starPts.push((880 + Math.cos(ang) * rr).toFixed(1) + "," + (160 + Math.sin(ang) * rr).toFixed(1)); }
  el("polygon", ink({ points: starPts.join(" "), fill: "#FFD166" }), badge);
  var num = el("text", { x: 880, y: 162, "text-anchor": "middle", class: "big", "font-size": 52, fill: INK }, badge, "+0.0%");
  el("text", { x: 880, y: 194, "text-anchor": "middle", class: "lbl" }, badge, "more sales from ads");

  // One curve for everything (ease-out), short staggers, a gentle rise for each entrance, a cross-fade between scenes.
  var out = function (x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); };
  function rise(g, ms, at, dur) { var k = out((ms - at) / (dur || 450)); g.setAttribute("opacity", k); g.setAttribute("transform", "translate(0 " + ((1 - k) * 14).toFixed(1) + ")"); }
  function render(s, p) {
    var ms = p * DUR, fadeIn = out(ms / 450), fadeOut = 1 - out((ms - (DUR - 450)) / 450), still = reduce || paused;
    G.forEach(function (g, i) {
      if (i !== s) { g.setAttribute("opacity", 0); return; }
      var k = still ? 1 : Math.min(fadeIn, fadeOut);
      g.setAttribute("opacity", k); g.setAttribute("transform", "translate(0 " + (still ? 0 : ((1 - fadeIn) * 10 - (1 - fadeOut) * 8)).toFixed(1) + ")");
    });
    if (s === 0) {
      rise(b1.g, ms, 300, 500);
      signs.forEach(function (x, i) { rise(x.g, ms, 900 + i * 80); animateIcon(x.ic, ms); });
    } else if (s === 1) {
      var t = ease((ms - 300) / 5200);
      path.setAttribute("stroke-dashoffset", plen * (1 - t));
      qs.forEach(function (q) { rise(q.g, ms, 300 + q.at * 5200, 400); });
    } else if (s === 2) {
      rise(b3.g, ms, 300, 500);
      slots.forEach(function (x, i) { rise(x.g, ms, 1100 + i * 80); });
      guesses.forEach(function (q, i) { rise(q.g, ms, 3200 + i * 900, 450); });
    } else if (s === 3) {
      rise(guess, ms, 300, 500);
      darts.forEach(function (d, i) { rise(d, ms, 1100 + i * 350, 250); });
      rise(versus, ms, 3000, 400);
      rise(box, ms, 3400, 500);
      mkLines.forEach(function (l, i) { l.setAttribute("stroke-dashoffset", 200 * (1 - out((ms - 3800 - [250, 0, 400][i]) / 600))); });
      mkDot.setAttribute("opacity", out((ms - 3700) / 300));
      answers.forEach(function (g, i) { rise(g, ms, 5200 + i * 700, 450); });
    } else if (s === 4) {
      rbars.forEach(function (x, i) {
        var h = x.h * ease((ms - 400 - i * 80) / 900);
        x.b.setAttribute("y", base5 - h); x.b.setAttribute("height", h);
        x.t.setAttribute("y", base5 - h - 12); x.t.setAttribute("opacity", out((ms - 1300 - i * 80) / 300));
      });
    } else if (s === 5) {
      var t2 = ease((ms - 400) / 1800);
      pb.forEach(function (x) { var h = x.from + (x.to - x.from) * t2; x.b.setAttribute("y", x.base - h); x.b.setAttribute("height", h); });
      rise(badge, ms, 2400, 500);
      num.textContent = "+" + (PCT * out((ms - 2400) / 1200)).toFixed(1) + "%";
    }
  }

  var cap = document.getElementById("cap"), dots = document.getElementById("dots"), current = -1;
  SCENES.forEach(function (sc, i) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", "Scene " + (i + 1) + ": " + sc[1]);
    b.appendChild(document.createElement("i"));
    b.addEventListener("click", function () { jump(i); });
    dots.appendChild(b);
  });
  function setCaption(s, p) {
    if (s !== current) {
      current = s;
      cap.innerHTML = '<span class="act">' + SCENES[s][0] + "</span>" + SCENES[s][1] + "<small>" + SCENES[s][2] + "</small>";
    }
    [].forEach.call(dots.children, function (d, i) {
      d.className = i < s ? "done" : "";
      d.firstChild.style.width = (i === s ? p * 100 : 0) + "%";
    });
  }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var t = 0, last = null, paused = false, pp = document.getElementById("pp"), ppicon = document.getElementById("ppicon");
  function setPaused(p) {
    paused = p;
    ppicon.setAttribute("d", p ? "M8 5v14l11-7z" : "M7 5h4v14H7zM13 5h4v14h-4z");
    pp.setAttribute("aria-label", p ? "Play the story" : "Pause the story");
  }
  pp.addEventListener("click", function () { setPaused(!paused); });
  // A clicked scene starts just after its fade-in and plays from there.
  function jump(i) { t = i * DUR + (reduce ? DUR - 1 : 0); setPaused(false); draw(); }
  function draw() { var s = Math.floor(t / DUR) % N, p = (t % DUR) / DUR; setCaption(s, p); render(s, p); }
  if (reduce) { pp.hidden = true; jump(0); return; }  // No motion: each scene shows its last frame; the dots switch scenes.
  function tick(now) {
    if (last !== null && !paused) t = (t + now - last) % (DUR * N);
    last = now;
    draw();
    requestAnimationFrame(tick);
  }
  draw();  // the first frame right away, before the first animation frame arrives
  requestAnimationFrame(tick);
})();
</script>
